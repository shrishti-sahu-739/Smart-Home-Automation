<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Home Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
}

/* TITLE */

h1{
text-align:center;
padding:30px;
}

/* GRID LAYOUT */

.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
padding:40px;
}

/* DEVICE CARD */

.device{
background:#1f1f1f;
border-radius:15px;
padding:25px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.6);
transition:0.3s;
}

.device:hover{
transform:translateY(-8px);
box-shadow:0 0 20px #00e5ff;
}

/* DEVICE IMAGE */

.device img{
width:70px;
margin-bottom:10px;
}

/* DEVICE NAME */

.device h3{
margin-bottom:15px;
}

/* SWITCH */

.switch{
position:relative;
display:inline-block;
width:60px;
height:30px;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#ff4b4b;
transition:.4s;
border-radius:34px;
}

.slider:before{
position:absolute;
content:"";
height:22px;
width:22px;
left:4px;
bottom:4px;
background:white;
transition:.4s;
border-radius:50%;
}

input:checked + .slider{
background:#00ff7f;
}

input:checked + .slider:before{
transform:translateX(30px);
}

/* STATUS */

.status{
margin-top:10px;
font-size:14px;
}

</style>

</head>

<body>

<h1>Smart Home Dashboard</h1>

<div class="container">

<div class="device">

<img src="light.png">

<h3>Light</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

<div class="device">

<img src="fan.png">

<h3>Fan</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

<div class="device">

<img src="ac.png">

<h3>AC</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

<div class="device">

<img src="tv.png">

<h3>TV</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

<div class="device">

<img src="switch.png">

<h3>Switch</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

<div class="device">

<img src="fridge.png">

<h3>Fridge</h3>

<label class="switch">
<input type="checkbox" onchange="toggle(this)">
<span class="slider"></span>
</label>

<div class="status">OFF</div>

</div>

</div>

<script>

function toggle(x){

let status = x.parentElement.parentElement.querySelector(".status");

if(x.checked){
status.innerHTML="ON";
}
else{
status.innerHTML="OFF";
}

}

</script>

</body>
</html>
